<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#f6f4f4">

<meta property="og:description" content="Tap to connect — WhatsApp, Call, Email, Instagram.">
<meta property="og:image" content="avatar.jpg">

<link rel="preload" as="image" href="avatar.jpg">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;1,800;1,900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4f4;
    --card:#ffffff;
    --ink:#141012;
    --muted:#857a7c;
    --red:#c8102e;
    --red-soft:#fdecee;
    --red-grad:linear-gradient(115deg,#6d000e 0%,#b00f25 30%,#e3263c 52%,#b00f25 74%,#6d000e 100%);
    --line:#f0e4e6;
    --shadow-lg:0 2px 4px rgba(80,10,20,.04), 0 30px 60px -28px rgba(80,10,20,.30);
    --shadow-sm:0 1px 2px rgba(80,10,20,.06), 0 8px 18px -12px rgba(80,10,20,.28);
    --display:Montserrat, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --sans:Manrope, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{
    min-height:100dvh;
    font-family:var(--sans);
    color:var(--ink);
    background:
      radial-gradient(90% 50% at 50% -10%, #ffffff 0%, transparent 60%),
      radial-gradient(60% 40% at 110% 60%, #f7e3e5 0%, transparent 70%),
      radial-gradient(60% 40% at -10% 90%, #efe6e7 0%, transparent 70%),
      var(--bg);
    display:flex;flex-direction:column;align-items:center;
    padding:max(22px, env(safe-area-inset-top)) 16px max(26px, env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}

  .wrap{width:100%;max-width:410px}
  .rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
  .rise.d1{animation-delay:.08s}.rise.d2{animation-delay:.16s}.rise.d3{animation-delay:.24s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* ---------- main card ---------- */
  .card{
    position:relative;background:var(--card);border-radius:30px;
    box-shadow:var(--shadow-lg);
    border:1px solid rgba(200,16,46,.12);
    overflow:hidden;
  }
  .cover{
    position:relative;height:140px;overflow:hidden;
    background:linear-gradient(180deg,#ffffff,#f4f1f1);
  }
  /* angled red shapes, echoing the poster */
  .cover .s1,.cover .s2,.cover .s3{position:absolute;inset:0}
  .cover .s1{background:var(--red-grad);clip-path:polygon(58% 0,100% 0,100% 100%,34% 100%)}
  .cover .s2{background:linear-gradient(135deg,#8a0014,#4d0009);clip-path:polygon(82% 0,100% 0,100% 100%,62% 100%);opacity:.85}
  .cover .s3{background:repeating-linear-gradient(115deg, rgba(200,16,46,.07) 0 1px, transparent 1px 10px);clip-path:polygon(0 0,58% 0,34% 100%,0 100%)}
  .cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--red-grad)}
  .logo{position:absolute;top:14px;left:16px;width:84px;height:auto;filter:drop-shadow(0 1px 0 #fff)}
  .share{
    position:absolute;top:14px;right:14px;
    width:40px;height:40px;border-radius:50%;
    display:grid;place-items:center;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);color:#fff;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:transform .15s, background .2s;
  }
  .share svg{width:18px;height:18px}
  .share:active{transform:scale(.92)}
  @media (hover:hover){.share:hover{background:rgba(255,255,255,.28)}}

  .avatar{
    position:relative;z-index:1;
    width:154px;height:154px;margin:-80px auto 0;border-radius:50%;
    padding:4px;background:var(--red-grad);
    box-shadow:0 20px 40px -16px rgba(120,0,20,.55);
  }
  .avatar img{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover;border:4px solid #fff}
  .avatar .dot{
    position:absolute;right:12px;bottom:12px;width:20px;height:20px;border-radius:50%;
    background:#25D366;border:3px solid #fff;
  }

  .id{text-align:center;padding:18px 20px 0}
  .name{font-family:var(--display);font-style:italic;font-weight:900;text-transform:uppercase;line-height:.98;letter-spacing:-.01em}
  .name .l1{display:block;font-size:clamp(32px,9.6vw,40px);color:var(--ink)}
  .name .l2{display:block;font-size:clamp(32px,9.6vw,40px);background:var(--red-grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.08em}
  .bar{width:120px;height:3px;margin:14px auto 0;border-radius:3px;background:linear-gradient(90deg,var(--red) 0 45%,#e9dfe0 45%)}
  .role{
    margin-top:14px;display:inline-flex;align-items:center;gap:12px;
    padding:10px 20px 10px 16px;border-radius:14px;
    background:var(--red-grad);color:#fff;
    box-shadow:0 12px 24px -14px rgba(160,0,25,.9);
    transform:skewX(-8deg);
  }
  .role > *{transform:skewX(8deg)}
  .role svg{width:20px;height:20px}
  .role .sep{width:1px;height:22px;background:rgba(255,255,255,.55)}
  .role span{font-family:var(--display);font-size:15px;font-weight:500;letter-spacing:.02em}
  .role b{font-weight:700}

  /* quick actions */
  .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:24px 20px 6px}
  .q{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--muted)}
  .q i{
    width:58px;height:58px;border-radius:19px;display:grid;place-items:center;
    background:var(--red-soft);color:var(--red);
    border:1px solid rgba(200,16,46,.14);
    transition:transform .15s ease, box-shadow .2s;
  }
  .q svg{width:25px;height:25px}
  .q:active i{transform:scale(.92)}
  @media (hover:hover){.q:hover i{box-shadow:var(--shadow-sm)}}
  .q.wa i{background:#25D366;border-color:#25D366;color:#fff;box-shadow:0 10px 20px -10px rgba(37,211,102,.8)}

  /* contact rows */
  .rows{padding:18px 16px 16px;display:grid;gap:10px}
  .row{
    display:flex;align-items:center;gap:14px;
    padding:12px 14px;border-radius:18px;
    background:#fff;border:1px solid var(--line);
    transition:transform .15s ease, border-color .2s, box-shadow .2s;
  }
  .row:active{transform:scale(.985)}
  @media (hover:hover){.row:hover{border-color:rgba(200,16,46,.4);box-shadow:var(--shadow-sm)}}
  .ico{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;color:#fff}
  .ico svg{width:22px;height:22px}
  .ico.wa{background:linear-gradient(135deg,#2fe07a,#1ebe5b)}
  .ico.ph{background:linear-gradient(135deg,#d2132f,#8a0014)}
  .ico.em{background:linear-gradient(135deg,#2a1a1d,#141012)}
  .ico.ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
  .row .t{flex:1;min-width:0}
  .row b{display:block;font-size:15px;font-weight:700}
  .row small{display:block;margin-top:2px;font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .arr{width:18px;height:18px;color:#cdb9bc;flex:none}

  /* save button */
  .save{
    margin:4px 16px 18px;width:calc(100% - 32px);
    display:flex;align-items:center;justify-content:center;gap:10px;
    padding:17px;border-radius:18px;
    background:var(--red-grad);color:#fff;
    font-size:15px;font-weight:700;letter-spacing:.04em;
    box-shadow:0 16px 30px -16px rgba(140,0,20,.9), inset 0 1px 0 rgba(255,255,255,.15);
    position:relative;overflow:hidden;
    transition:transform .15s ease;
  }
  .save::after{
    content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);
    animation:shine 4.5s ease-in-out 1.2s infinite;
  }
  @keyframes shine{0%{left:-60%}35%,100%{left:130%}}
  .save svg{width:20px;height:20px}
  .save:active{transform:scale(.98)}

  /* QR */
  .qr{
    margin-top:16px;background:var(--card);border-radius:24px;padding:18px;
    border:1px solid rgba(200,16,46,.12);box-shadow:var(--shadow-sm);
    display:flex;align-items:center;gap:16px;
  }
  .qr .code{width:112px;height:112px;flex:none;padding:4px;border-radius:14px;background:#fff;border:1px solid var(--line)}
  .qr .code img{width:100%;height:100%;display:block;image-rendering:pixelated}
  .qr h2{font-family:var(--display);font-style:italic;font-size:20px;font-weight:800;line-height:1.1;text-transform:uppercase}
  .qr h2 em{color:var(--red);font-style:inherit}
  .qr p{margin-top:5px;font-size:13px;color:var(--muted);line-height:1.45}
  .qr .dl{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--red);border-bottom:1px solid currentColor}

  footer{margin-top:22px;text-align:center;font-size:10.5px;letter-spacing:.32em;color:var(--muted)}
  footer b{color:var(--red);font-weight:700}

  .toast{
    position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,20px);
    background:#141012;color:#fff;font-size:13px;font-weight:600;
    padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (max-width:360px){
    .q i{width:52px;height:52px;border-radius:17px}
  }
  @media (prefers-reduced-motion:reduce){.rise,.save::after{animation:none}}
</style>
</head>
<body>

      <a class="q" href="mailto:munazil1990@gmail.com"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M3 6.5l9 6.5 9-6.5"/></svg></i>Email</a>

<div class="toast" id="toast" role="status"></div>

<script>
  var PHONE = "971567909956";
  var EMAIL = "munazil1990@gmail.com";
  var IG    = "https://www.instagram.com/munazil_09/";
  var PAGE  = "https://web3saad.github.io/munazil-card/";

  var waUrl = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent("Hi Munazil 👋");
  document.querySelectorAll("[data-wa]").forEach(function(a){ a.href = waUrl; });

  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("on");
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("on"); }, 1800);
  }

  var vcf = "BEGIN:VCARD\r\nVERSION:3.0\r\nN:Munazil;Ahammed;;;\r\nFN:Ahammed Munazil" +
            "\r\nTITLE:Sales Manager" +
            "\r\nTEL;TYPE=CELL,VOICE:+" + PHONE +
            "\r\nEMAIL;TYPE=INTERNET:" + EMAIL +
            "\r\nURL:" + IG + "\r\nEND:VCARD";
  document.querySelectorAll("[data-save]").forEach(function(el){
    el.addEventListener("click", function(e){
      e.preventDefault();
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([vcf], {type:"text/vcard"}));
      a.download = "Ahammed-Munazil.vcf";
      document.body.appendChild(a); a.click(); a.remove();
      toast("Contact downloaded");
    });
  });

  document.getElementById("share").addEventListener("click", function(){
    if (navigator.share) {
      navigator.share({ title: "Ahammed Munazil", text: "Connect with Ahammed Munazil, Sales Manager", url: PAGE }).catch(function(){});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(PAGE).then(function(){ toast("Link copied"); }, function(){ toast(PAGE); });
    } else {
      toast(PAGE);
    }
  });
</script>
